[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-center-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-postgres>=0.0.9",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.9",
    "mcp>=1.0.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "faker>=26.0.0",
]

[tool.setuptools.packages.find]
include = ["rag*", "ccai_mcp*", "retrieval*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.10",
]

# Pinned dev dependency group for the OLAP / semantic layer (dbt + MetricFlow).
# Install with:  uv sync --group dbt
# dbt-postgres versioning is decoupled from dbt-core (adapter 1.11.x pairs with
# core 1.12.x); dbt-metricflow provides the `mf` (MetricFlow) CLI.
[dependency-groups]
dbt = [
    "dbt-core==1.12.5",
    "dbt-postgres==1.11.0",
    "dbt-metricflow==0.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["blogs/"]

[tool.ruff.lint]
# Pragmatic default set; individual rules can be refined on future tickets.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # Existing modules are not import-sorted yet; sort in a later hygiene pass.
    "I001",
    # Common, intentional patterns in the current codebase.
    "B008",  # function-call defaults in argument positions
    "SIM102",  # collapsible if
    "SIM108",  # ternary refactor
    # Pre-existing in the seeded generator / pipeline. Left alone so the generator
    # output stays byte-identical; tighten these rules on future tickets.
    "E501",  # long dialogue-template lines in data/synthetic/generate_data.py
    "B007",  # unused loop-control variables
    "B905",  # zip() without explicit strict (intentional, pre-dating the check)
    "F841",  # unused local assignments
    "F811",  # redefined import (PGVector in rag/embeddings.py)
]

[tool.pytest.ini_options]
markers = [
    "integration: requires network, API keys, or a reachable database; skipped by default",
]

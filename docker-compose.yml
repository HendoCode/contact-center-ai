services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contactcenter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  structurizr:
    image: structurizr/structurizr:latest
    command: local
    ports:
      - "8080:8080"
    volumes:
      - ./docs/architecture:/usr/local/structurizr

volumes:
  pgdata:

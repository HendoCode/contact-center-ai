name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .

  test:
    name: pytest (non-integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --group lance --group agent
      # Non-integration tests must pass offline with no DB/keys, matching local
      # `make test`. The DB-backed tests in test_metrics.py self-skip when no
      # Postgres is available, so no service is provided here.
      - name: Run non-integration tests
        run: uv run pytest -m "not integration"

  evals:
    name: agent evals (offline regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --group agent
      # The deterministic evaluators over the golden set: fake classifier, stub tools, no
      # keys, no DB. The LLM-as-judge runs only in `make evals-live`.
      - run: make evals

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  check-public:
    name: check-public
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_public.sh

  terraform:
    name: terraform (fmt, validate, tflint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - name: fmt
        run: terraform fmt -check -recursive
      - name: validate (no backend)
        run: |
          for root in bootstrap envs/dev; do
            (cd "$root" && terraform init -backend=false -input=false && terraform validate)
          done
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('infra/azure/.tflint.hcl') }}
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          tflint --recursive --config="$PWD/.tflint.hcl"

metrics:
- name: average_mortgage_note_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN product__lob = 'mortgage' THEN account_snapshot.mortgage_note_rate
        END)
  description: 'Average interest rate members PAY on first-lien mortgages (paid, fixed).
    "interest rate" meaning 1 of the collision.

    '
- name: note_rate_times_balance
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'mortgage' THEN mortgage_note_rate
        * mortgage_principal_balance END)
  description: 'Intermediate numerator for the principal-weighted mortgage portfolio
    rate (note_rate multiplied by outstanding principal, summed). Not a headline metric
    on its own.

    '
- name: weighted_mortgage_portfolio_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: (SUM(CASE WHEN product__lob = 'mortgage' THEN mortgage_note_rate
        * mortgage_principal_balance END)) / (SUM(CASE WHEN product__lob = 'mortgage'
        THEN account_snapshot.mortgage_principal_balance END))
  description: 'Mortgage note rate weighted by outstanding principal — the "what does
    our book actually cost" number, a RATIO (note_rate x balance) / balance, not a
    plain average. Numerator and denominator are declared metrics (note_rate_times_balance
    / mortgage_principal_balance), each lob-filtered.

    '
- name: average_heloc_current_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN product__lob = 'home' THEN account_snapshot.heloc_current_rate
        END)
  description: 'Average HELOC effective rate = base_rate + margin (variable, two source
    columns). "interest rate" meaning 2.

    '
- name: average_credit_card_purchase_apr
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN product__lob = 'cards' THEN account_snapshot.purchase_apr
        END)
  description: 'Average PURCHASE APR on cards — deliberately NOT the cash-advance
    APR on the same card. "interest rate" meaning 4a.

    '
- name: average_credit_card_cash_advance_apr
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN product__lob = 'cards' THEN account_snapshot.cash_advance_apr
        END)
  description: 'Average cash-advance APR on cards. "interest rate" meaning 4b — a
    different rate on the same piece of plastic.

    '
- name: average_deposit_apy
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN product__lob = 'banking' THEN account_snapshot.deposit_apy
        END)
  description: 'Average rate members EARN on deposits (sign-flipped vs loans). "interest
    rate" meaning 5.

    '
- name: average_investment_return_pct
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN product__lob = 'investments' THEN account_snapshot.investment_return_pct
        END)
  description: 'Average investment return — explicitly NOT interest. "interest rate"
    meaning 6, which is not interest at all.

    '
- name: banking_available_balance
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'banking' THEN account_snapshot.banking_available_balance
        END)
  description: 'Total AVAILABLE balance on banking accounts (asset; holds/pending
    excluded). Additive across accounts. "balance" meaning 4b.

    '
- name: banking_ledger_balance
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'banking' THEN account_snapshot.banking_ledger_balance
        END)
  description: 'Total LEDGER balance on banking accounts (asset, gross of holds).
    "balance" meaning 4a.

    '
- name: checking_available_balance
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'banking' THEN account_snapshot.checking_available_balance
        END)
  description: Available balance, checking accounts only.
- name: savings_balance
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'banking' THEN account_snapshot.savings_balance
        END)
  description: Ledger balance on savings accounts only.
- name: credit_card_outstanding
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'cards' THEN account_snapshot.card_outstanding_balance
        END)
  description: 'Total outstanding credit-card balance — the SAME word "balance", the
    OPPOSITE sign (a liability, not an asset).

    '
- name: mortgage_principal_balance
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'mortgage' THEN account_snapshot.mortgage_principal_balance
        END)
  description: Outstanding first-lien principal. "balance" meaning 1.
- name: heloc_drawn_balance
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'home' THEN account_snapshot.heloc_drawn_balance
        END)
  description: Drawn HELOC balance. "balance" meaning 3.
- name: investment_market_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'investments' THEN account_snapshot.investment_market_value
        END)
  description: Total investment market value. "balance" meaning 6.
- name: investment_cash_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'investments' THEN account_snapshot.investment_cash_value
        END)
  description: Settled cash in investment accounts. "balance" meaning 7.
- name: escrow_balance
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'mortgage' THEN account_snapshot.escrow_balance
        END)
  description: Mortgage escrow balance. "balance" meaning 2.
- name: net_member_liquidity
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'banking' THEN account_snapshot.banking_available_balance
        END) - SUM(CASE WHEN product__lob = 'cards' THEN account_snapshot.card_outstanding_balance
        END)
  description: 'DERIVED: banking available balance (asset) MINUS card outstanding
    (liability). Only the semantic layer knows the sign conventions — raw SQL SUM(balance)
    would add assets to liabilities; this declared formula is the only place a blended
    relationship number is allowed to exist.

    '
- name: loan_to_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN product__lob = 'mortgage' THEN account_snapshot.ltv_at_origination
        END)
  description: 'Loan-to-value at origination (underwriting RISK) — a fact stored on
    the mortgage account, averaged. The "LTV" half of the homophone collision.

    '
- name: member_lifetime_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: (SUM(transactions.fee_revenue_amount) + SUM(transactions.interest_earned_amount))
        * 24 / COUNT(DISTINCT transactions.member_id)
  description: 'Lifetime customer value (marketing) — a DERIVED, PARAMETERIZED CONVENTION,
    not a fact. Declared formula (see olap/dbt/README.md): LCV = (relationship_revenue
    / active_members) x 24, where relationship revenue is fee + interest income over
    the trailing ~6-month window, x2 annualizes it, and x12 is the assumed relationship
    tenure in years (24 = 2 x 12). Because the formula is a convention, it is declared
    here once instead of being re-invented per dashboard.

    '
- name: total_fee_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(transactions.fee_revenue_amount)
  description: Fee revenue to the CU over the transaction window.
- name: total_interest_income
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(transactions.interest_earned_amount)
  description: Interest/dividends earned by members over the transaction window.
- name: relationship_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(transactions.fee_revenue_amount) + SUM(transactions.interest_earned_amount)
  description: Fee revenue + interest income (the numerator of the LCV convention).
- name: active_members
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT transactions.member_id)
  description: Distinct members with ledger activity in the window.
- name: credit_card_credit_limit
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'cards' THEN account_snapshot.card_credit_limit
        END)
  description: Card credit capacity. "limit" meaning 3.
- name: heloc_credit_limit
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN product__lob = 'home' THEN account_snapshot.heloc_credit_limit
        END)
  description: HELOC credit capacity. "limit" meaning 1.
- name: insurance_coverage_limit
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN product__lob = 'car_insurance' THEN account_snapshot.insurance_deductible
        END)
  description: 'Car-insurance deductible (a coverage "limit" — NOT credit capacity).
    "limit" meaning 2.

    '
- name: call_volume
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(1)
  description: Number of interactions (call volume — "volume" meaning 1 of 4).
- name: total_duration_seconds
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(interactions.duration_seconds)
  description: Sum of talk time. AHT is the derived ratio, not this.
- name: average_handle_time
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: (SUM(interactions.duration_seconds)) / (SUM(1))
  description: 'AHT = total talk time / number of calls — a derived RATIO, never a
    stored column.

    '
- name: first_contact_resolved_calls
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(case when first_contact_resolved then 1 else 0 end)
  description: Count of interactions resolved on first contact.
- name: first_contact_resolution_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: (SUM(case when first_contact_resolved then 1 else 0 end)) / (SUM(1))
  description: Share of interactions resolved on first contact.
- name: csat_average_score
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(csat_surveys.score)
  description: Average CSAT survey score (1-5).
- name: nps
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: (SUM(csat_surveys.is_promoter) - SUM(csat_surveys.is_detractor))
        / SUM(1) * 100
  description: 'NPS = (promoters - detractors) / responses x 100, on the 1-5 mapping
    (5=promoter, 4/3=passive, 2/1=detractor). A derived metric, never stored.

    '
- name: promoters
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(csat_surveys.is_promoter)
  description: Count of CSAT responses scored 5.
- name: detractors
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(csat_surveys.is_detractor)
  description: Count of CSAT responses scored 1 or 2.
- name: responses
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(1)
  description: Count of completed CSAT surveys.
- name: rate_locks_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(1)
  description: 'Count of rate locks in the mortgage/home pipeline ("lock" as a financing
    event — NOT a fraud account freeze).

    '
- name: rate_lock_volume
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(rate_locks.loan_amount)
  description: Sum of loan_amount across rate locks.
- name: rate_locks_exercised
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(rate_locks.is_exercised)
  description: Count of rate locks whose status is 'exercised'.
- name: rate_locks_expired
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(rate_locks.is_expired)
  description: Count of rate locks whose status is 'expired'.
- name: rate_lock_fallout_pct
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: (SUM(rate_locks.is_expired)) / (SUM(1))
  description: 'Share of rate locks that expired without exercising (fall-out) — a
    derived ratio.

    '

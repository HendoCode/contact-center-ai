    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: survey_id
  - name: interaction
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: interaction_id
  - name: member
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_id
  - name: staff
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: staff_id
  - name: team
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: team_id
  - name: surveyed_at
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: surveyed_at
    dimension:
      is_time: true
  - name: question_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: question_code
    dimension:
      is_time: false
  - name: survey_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: '1'
  - name: score_sum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: score
  - name: score_avg
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: score
  - name: promoters_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: is_promoter
  - name: detractors_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: is_detractor
- name: transactions
  source: '"contactcenter"."marts"."f_transaction"'
  primary_key:
  - transaction_id
  description: 'Ledger flow fact at 1-transaction grain. Amounts are signed — credits
    are positive, debits are negative.

    '
  fields:
  - name: transaction
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: transaction_id
  - name: account
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: account_id
  - name: member
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_id
  - name: product
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: product_id
  - name: posted_at
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: posted_at
    dimension:
      is_time: true
  - name: txn_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: txn_type
    dimension:
      is_time: false
  - name: status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: status
    dimension:
      is_time: false
  - name: amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    description: 'Net signed amount (a flow). Never compare it to a snapshot balance
      — that is the stock-vs-flow collision.

      '
  - name: txn_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: '1'
  - name: fee_revenue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fee_revenue_amount
    description: Fee revenue to the CU (stored debits, negated).
  - name: interest_income
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: interest_earned_amount
    description: Interest/dividends earned by members.
  - name: interest_expense
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: interest_paid_amount
    description: Interest charged to members (seed currently emits none).
  - name: premium_paid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: premium_paid_amount
    description: Insurance premiums paid by members (a flow, not the rate premium).
  - name: distinct_members
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_id

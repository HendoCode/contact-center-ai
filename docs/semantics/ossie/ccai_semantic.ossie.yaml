version: 0.2.0.dev0
name: ccai_semantic
datasets:
- name: products
  source: '"contactcenter"."marts"."d_product"'
  primary_key:
  - product_id
  description: 'Product dimension carrying the LOB discriminator. The `lob` dimension
    on this model is referenced as `Dimension(''product__lob'')` from every fact that
    joins to it, and it is what turns "average interest rate" into four different
    auditable metrics.

    '
  fields:
  - name: product
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: product_id
  - name: lob
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lob
    dimension:
      is_time: false
    description: Line of business — the discriminator for every colliding metric.
  - name: product_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: product_code
    dimension:
      is_time: false
  - name: product_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: product_name
    dimension:
      is_time: false
  - name: is_active
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: is_active
    dimension:
      is_time: false
- name: members
  source: '"contactcenter"."marts"."d_member"'
  primary_key:
  - member_id
  description: Member dimension (person or business entity).
  fields:
  - name: member
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_id
  - name: household
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: household_id
  - name: member_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_type
    dimension:
      is_time: false
  - name: credit_score_band
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: credit_score_band
    dimension:
      is_time: false
  - name: residence_state
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: residence_state
    dimension:
      is_time: false
- name: households
  source: '"contactcenter"."marts"."d_household"'
  primary_key:
  - household_id
  description: Household dimension (relationship pricing / household LCV).
  fields:
  - name: household
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: household_id
  - name: income_band
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: income_band
    dimension:
      is_time: false
  - name: household_label
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: household_label
    dimension:
      is_time: false
- name: staff
  source: '"contactcenter"."marts"."d_staff"'
  primary_key:
  - staff_id
  description: Staff (agent/specialist/supervisor) dimension.
  fields:
  - name: staff
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: staff_id
  - name: team
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: team_id
  - name: role
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: role
    dimension:
      is_time: false
- name: teams
  source: '"contactcenter"."marts"."d_team"'
  primary_key:
  - team_id
  description: Team dimension (function area).
  fields:
  - name: team
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: team_id
  - name: team_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: team_name
    dimension:
      is_time: false
  - name: function_area
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: function_area
    dimension:
      is_time: false
- name: account_snapshot
  source: '"contactcenter"."marts"."f_account_snapshot"'
  primary_key:
  - account_id
  description: 'Account balance/rate snapshot at account x snapshot_date (monthly)
    grain. Every measure is lob-qualified and null-per-type; each is declared separately
    so none can be summed across LOBs into a garbage blended number.

    '
  fields:
  - name: account
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: account_id
  - name: member
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_id
  - name: product
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: product_id
  - name: snapshot_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: snapshot_date
    dimension:
      is_time: true
  - name: account_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: status
    dimension:
      is_time: false
  - name: mortgage_note_rate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mortgage_note_rate
    description: Average rate members PAY on first-lien mortgages (paid, fixed).
  - name: note_rate_times_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mortgage_note_rate * mortgage_principal_balance
    description: Numerator for the principal-weighted mortgage portfolio rate.
  - name: mortgage_principal_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mortgage_principal_balance
    description: Outstanding first-lien principal (denominator for weighting).
  - name: purchase_apr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: purchase_apr
    description: Average PURCHASE APR on cards (deliberately not cash-advance).
  - name: cash_advance_apr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cash_advance_apr
    description: Average cash-advance APR on cards (a different rate, same card).
  - name: deposit_apy
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deposit_apy
    description: Average rate members EARN on deposits (sign flipped vs loans).
  - name: heloc_base_rate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: heloc_base_rate
  - name: heloc_margin
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: heloc_margin
  - name: heloc_current_rate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: heloc_current_rate
    description: HELOC effective rate = base_rate + margin (two source columns).
  - name: investment_return_pct
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: investment_return_pct
    description: Investment return — explicitly NOT interest.
  - name: ltv_at_origination
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ltv_at_origination
    description: Loan-to-value at origination (underwriting risk; the LTV half of
      the homophone).
  - name: banking_available_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: banking_available_balance
    description: Total available balance on banking accounts (asset).
  - name: banking_ledger_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: banking_ledger_balance
  - name: checking_ledger_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: checking_ledger_balance
  - name: checking_available_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: checking_available_balance
  - name: savings_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: savings_balance
  - name: card_outstanding_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: card_outstanding_balance
    description: Total outstanding credit-card balance (LIABILITY sign).
  - name: card_credit_limit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: card_credit_limit
    description: Card credit capacity ("limit" meaning 3).
  - name: card_available_credit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: card_available_credit
  - name: heloc_drawn_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: heloc_drawn_balance
  - name: heloc_credit_limit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: heloc_credit_limit
    description: HELOC credit capacity ("limit" meaning 1).
  - name: investment_market_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: investment_market_value
  - name: investment_cash_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: investment_cash_value
  - name: escrow_balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: escrow_balance
  - name: insurance_annual_premium
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: insurance_annual_premium
    description: Car-insurance premium (money moved, not a rate).
  - name: insurance_monthly_premium
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: insurance_monthly_premium
  - name: insurance_deductible
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: insurance_deductible
    description: Insurance coverage "limit" (not credit capacity).
- name: interactions
  source: '"contactcenter"."marts"."f_interaction"'
  primary_key:
  - interaction_id
  description: Contact fact at 1-interaction grain.
  fields:
  - name: interaction
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: interaction_id
  - name: member
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_id
  - name: staff
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: staff_id
  - name: team
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: team_id
  - name: started_at
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: started_at
    dimension:
      is_time: true
  - name: channel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: channel
    dimension:
      is_time: false
  - name: direction
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: direction
    dimension:
      is_time: false
  - name: outcome
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: outcome
    dimension:
      is_time: false
  - name: caller_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: caller_type
    dimension:
      is_time: false
  - name: category_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: category_code
    dimension:
      is_time: false
  - name: hour_of_day
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hour_of_day
    dimension:
      is_time: false
  - name: interaction_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: '1'
    description: Call volume ("volume" meaning 1 of 4).
  - name: duration_seconds
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: duration_seconds
    description: Total talk time in seconds (AHT is a derived ratio, not this).
  - name: escalated_calls
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: case when outcome = 'escalated' then 1 else 0 end
  - name: first_contact_resolved_calls
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: case when first_contact_resolved then 1 else 0 end
- name: csat_surveys
  source: '"contactcenter"."marts"."f_csat"'
  primary_key:

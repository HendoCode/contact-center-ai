apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ccai.component" (dict "root" . "name" "config") }}
  labels:
    {{- include "ccai.labels" . | nindent 4 }}
data:
  {{- range $key, $value := omit .Values.config "RETRIEVER_BACKEND" "LANCE_URI" "OLLAMA_BASE_URL" "DATABASE_URL" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  RETRIEVER_BACKEND: {{ .Values.retrieverBackend | quote }}
  LANCE_URI: {{ include "ccai.lanceUri" . | quote }}
  {{- with include "ccai.ollamaUrl" . }}
  OLLAMA_BASE_URL: {{ . | quote }}
  {{- end }}
